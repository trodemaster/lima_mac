# Reference macOS 15 test configuration
#
# This mirrors the upstream Lima template://macos-15 exactly, with only
# the IPSW updated to the 15.6.1 (24G90) build. Use this to validate patches
# against a stock Lima configuration without custom provisioning or mounts.
#
# Usage:
#   limactl create --name=macos-15-test ./macos-15-test.yaml
#   limactl start macos-15-test
#   limactl remove -f macos-15-test

minimumLimaVersion: "2.1.0"

base:
- template:_default/mounts

images:
- location: "https://updates.cdn-apple.com/2025SummerFCS/fullrestores/093-10809/CFD6DD38-DAF0-40DA-854F-31AAD1294C6F/UniversalMac_15.6.1_24G90_Restore.ipsw"
  arch: "aarch64"

os: Darwin
arch: aarch64
vmType: vz

containerd:
  system: false
  user: false

# The installer requires a display device.
video:
  display: "default"

# B1 (upstream-pr/b1-fakecloudinit) live test: skip the Setup Assistant wizard
# on first login via the osOpts.Darwin.suppressFirstLoginSetup feature.
osOpts:
  Darwin:
    suppressFirstLoginSetup: {}

message: |
  The user password for GUI session is stored in the `~/password` file in the guest.
  Consider changing it after the first login.
